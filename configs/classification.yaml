# 分类示例：ChnSentiCorp 酒店评论情感（负向 / 正向）。
# 本文件是默认配置，python main.py train 直接使用它。
task: classification

data:
  # huggingface：按仓库名下载到 data/ChnSentiCorp/
  # local：读取 data.path 指向的本地 csv/tsv/parquet/jsonl/json（文件或目录）
  source: huggingface
  name: lansinuote/ChnSentiCorp
  path: null
  text_column: text
  label_column: label
  # 本数据集目录内三划分文件齐全，无需按列切分，保持 null；
  # 若用单文件按列切分，填列名（取值 train/validation/test，兼容 dev/val 等别名，三类需齐全）
  split_column: null
  # 逻辑划分 → 目录内文件名前缀；默认如下，文件名前缀不同时才需要改
  splits:
    train: train
    validation: validation
    test: test
  # 每个划分最多取前多少条，调试用；null 表示全量
  max_samples: null
  # 类别显示名，顺序对应标签 0、1
  label_names: ["负向", "正向"]

embedding:
  # 仓库名（自动下载到 models/）或本地目录
  model: BAAI/bge-small-zh-v1.5
  batch_size: 32

model:
  # 可选 linear_svc | logistic_regression
  name: linear_svc
  # 留空则使用内置默认网格
  param_grid:
    C: [0.01, 0.1, 1.0, 10.0]
  # 调参指标；留空用 f1_macro
  scoring: null
  # true：评估后用 train+validation+test 全量重训交付模型；指标仍来自留出 test
  refit_full: true

runtime:
  # auto 依次尝试 cuda、mps、cpu
  device: auto
  seed: 42

output:
  dir: artifacts
