# 回归任务：豆瓣长评 → 评分（1-5）
# 数据集不入库：先把数据放到 data/niulai/clean.jsonl，或改成自己的路径与列名。
# 用法：python main.py train -c configs/regression.yaml
task: regression

data:
  source: local
  path: data/niulai/clean.jsonl
  text_column: text
  label_column: score
  # 数据里若有 train/validation/test 列，填列名（兼容 dev/val 等别名，三类需齐全）；
  # 否则按 8:1:1 随机切分
  split_column: null
  max_samples: null

embedding:
  model: BAAI/bge-small-zh-v1.5
  batch_size: 32
  # 影评偏长，按 380 字切块后取平均，避免只编码开头
  chunk_chars: 380

model:
  name: ridge
  param_grid:
    alpha: [0.1, 1.0, 10.0, 100.0]
  # 评估后在全量数据上重训交付模型
  refit_full: true

runtime:
  device: auto
  seed: 42

output:
  # 与分类任务分开存放，避免互相覆盖
  dir: artifacts/regression
