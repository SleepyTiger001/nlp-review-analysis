[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
    "RUF", # ruff 自有规则
]
ignore = [
    "RUF001", # 中文字符串里的全角标点是正常的
    "RUF002", # 中文 docstring 里的全角标点是正常的
    "RUF003", # 中文注释里的全角标点是正常的
    "ANN401", # sklearn 模型与 joblib 产物类型多样，统一用 Any 表达
]

[tool.ruff.lint.per-file-ignores]
# webapp.py 的中文 docstring 与接口清单常有超长行，不做 E501 检查。
"webapp.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
